name: Build CitationLive for ARM

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/build-citationvoice.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: citationvoice-main-build
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: src/go.sum

      - name: Test Go code
        working-directory: src
        run: |
          go mod verify
          go vet ./...
          go test ./...

      - name: Build speaker binary
        working-directory: src
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
          CGO_ENABLED: '0'
        run: go build -trimpath -buildvcs=false -ldflags='-s -w' -o "$RUNNER_TEMP/citationvoice" .

      - name: Publish a changed binary to main
        run: |
          set -euo pipefail
          binary=CitationLive/dist/citationvoice
          source_tree=$(git rev-parse HEAD:src)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch --no-tags origin refs/heads/main
            latest=$(git rev-parse FETCH_HEAD)
            if [[ "$(git rev-parse "$latest:src")" != "$source_tree" ]]; then
              echo "A newer change to src is on main. Its workflow will publish the matching binary."
              exit 0
            fi
            git reset --hard "$latest"
            if cmp -s "$RUNNER_TEMP/citationvoice" "$binary"; then
              echo "The speaker binary already matches the Go sources."
              exit 0
            fi
            install -m 0644 "$RUNNER_TEMP/citationvoice" "$binary"
            git add -- "$binary"
            git commit -m 'build: refresh CitationLive ARM binary'
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
          done
          echo "Unable to publish the speaker binary to main." >&2
          exit 1
